<section class="panel">
<div class="panel-heading">
<h2>Pendientes de operación
</h2><span class="pill">{{ blockers|length }}</span>
</div>{% for item in blockers %}
<div class="attention-item"><span class="attention-symbol">!</span>
<div><p>{{ item.description }}</p><small>{{ item.guidance }}</small>{% if item.url %}<a class="text-link" href="{{ item.url }}">Revisar →</a>{% endif %}
</div>
</div>{% empty %}
<div class="empty"><span class="ready-mark">✓</span><strong>Sin pendientes</strong><p>No hay asuntos operativos pendientes.</p>
</div>{% endfor %}
</section>
