<div class="admin-fields">{% for field in fields %}<div class="admin-field {% if field.field.widget.input_type == 'checkbox' %}admin-field--check{% endif %}" data-field="{{ field.name }}">{{ field.label_tag }}{% if not field.field.required and field.field.widget.input_type != 'checkbox' %}<span class="flow-optional">Opcional</span>{% endif %}{{ field }}{% if field.help_text %}<small>{{ field.help_text }}</small>{% endif %}{{ field.errors }}</div>{% endfor %}</div>
