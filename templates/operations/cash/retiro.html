{% extends "operations/cash/base.html" %}{% block cash_content %}<section class="cash-withdraw"><a class="cash-back" href="{% url 'cash_operations:page' 'activa' %}">← Volver a caja</a><p class="eyebrow">SALIDA DE EFECTIVO</p><h1>Retiro de efectivo</h1><p class="cash-intro">Registra el monto y el motivo. El movimiento quedará a tu nombre para revisión posterior.</p><form method="post" action="{% url 'cash_operations:action' 'retirar' %}" data-cash-form class="cash-card">{% csrf_token %}<input type="hidden" name="cash_session" value="{{ cash_session_id }}"><input type="hidden" name="withdrawal_token" value="{{ withdrawal_token }}"><div class="cash-withdraw-fields"><div><label class="field-label" for="withdraw-amount">Monto</label><div class="cash-money"><span>Q</span><input id="withdraw-amount" name="amount" type="number" min="0.01" step="0.01" max="999999999999.99" placeholder="0.00" required autofocus></div><label class="field-label" for="withdraw-reason">Motivo</label><input class="input" id="withdraw-reason" name="reason" maxlength="500" placeholder="Describe el motivo del retiro" required><div class="cash-reasons" aria-label="Motivos frecuentes"><button type="button" data-reason="Cambio">Cambio</button><button type="button" data-reason="Compra operativa">Compra operativa</button><button type="button" data-reason="Entrega a Gerencia">Entrega a Gerencia</button><button type="button" data-reason="">Otro</button></div><p class="cash-requester"><span>Registrado por</span><strong>{{ operator_name }}</strong></p></div></div><p class="form-error" data-form-error role="alert" hidden></p><div class="cash-form-actions"><a class="cash-back" href="{% url 'cash_operations:page' 'activa' %}">Cancelar</a><button class="button button--primary">Registrar retiro</button></div></form></section>{% endblock %}
