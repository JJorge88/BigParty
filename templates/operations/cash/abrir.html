{% extends "operations/cash/base.html" %}{% block cash_content %}<section class="cash-centered"><p class="eyebrow">INICIO DE TURNO</p><h1>Abrir caja</h1><p class="cash-intro">Registra el fondo inicial para comenzar.</p><form class="cash-card" method="post" action="{% url 'cash_operations:action' 'abrir' %}" data-cash-form>{% csrf_token %}<label class="field-label" for="opening-float">Fondo inicial</label><div class="cash-money"><span>Q</span><input id="opening-float" name="opening_float" type="number" min="0" step="0.01" max="999999999999.99" placeholder="0.00" required autofocus></div><p class="cash-hint">Efectivo físico con el que inicia esta caja.</p><p class="form-error" data-form-error role="alert" hidden></p><button class="button button--primary button--wide">Abrir caja <svg aria-hidden="true"><use href="#icon-enter"/></svg></button></form><form method="post" action="{% url 'cash_operations:lock' %}" data-cash-form>{% csrf_token %}<button class="cash-back">Cancelar / cambiar usuario</button></form></section>{% endblock %}
