{% extends "operations/cash/base.html" %}{% block cash_content %}<section class="cash-centered"><a class="cash-back" href="{% url 'cash_operations:page' 'activa' %}">← Volver a caja</a><p class="eyebrow">CIERRE · PASO 1 DE 2</p><h1>Cerrar caja</h1><p class="cash-intro">Cuenta el efectivo físico de la caja.</p><form class="cash-card" method="post" action="{% url 'cash_operations:action' 'contar' %}" data-cash-form>{% csrf_token %}<input type="hidden" name="cash_session" value="{{ cash_session_id }}"><label class="field-label" for="counted-cash">Efectivo contado</label><div class="cash-money"><span>Q</span><input id="counted-cash" name="counted_cash" type="number" min="0" step="0.01" max="999999999999.99" placeholder="0.00" required autofocus></div><p class="cash-hint">Revisa el conteo antes de continuar. Una vez registrado, no podrás modificarlo ni agregar movimientos.</p><p class="form-error" data-form-error role="alert" hidden></p><button class="button button--primary button--wide">Registrar conteo <svg aria-hidden="true"><use href="#icon-enter"/></svg></button></form></section>{% endblock %}
