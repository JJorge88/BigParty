{% extends 'operations/cash/base.html' %}
{% block cash_content %}<section class="cash-centered cash-closed"><span class="cash-closed-icon">✓</span><p class="eyebrow">PEDIDO {{ number }}</p><h1>Venta completada</h1>{% if alias %}<p class="cash-intro">{{ alias }}</p>{% endif %}<div class="cash-card"><dl class="cash-details"><div><dt>Total</dt><dd>{{ total }}</dd></div><div><dt>Método</dt><dd>{{ methods }}</dd></div></dl>{% if kitchen %}<p class="cash-outcome">Pedido enviado a Cocina</p>{% endif %}<form method="post" action="{% url 'cash_operations:new-sale' %}" data-cash-form>{% csrf_token %}<button class="button button--primary button--wide">Nueva venta</button></form><a class="button button--ghost button--wide" href="{% url 'cash_operations:page' 'activa' %}">Volver a caja</a></div></section>{% endblock %}
