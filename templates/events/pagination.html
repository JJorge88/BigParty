{% if rows.has_other_pages %}<nav class="actions pagination">{% if rows.has_previous %}<a href="?page={{ rows.previous_page_number }}&filter={{ selected }}&q={{ search|urlencode }}">← Anterior</a>{% endif %}<span>{{ rows.number }} / {{ rows.paginator.num_pages }}</span>{% if rows.has_next %}<a href="?page={{ rows.next_page_number }}&filter={{ selected }}&q={{ search|urlencode }}">Siguiente →</a>{% endif %}</nav>{% endif %}
